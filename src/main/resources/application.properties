spring.profiles.default=home

spring.application.name=two-hello-world

server.port=8080
server.servlet.context-path=/exercise/api
springdoc.api-docs.path=/api-docs

# Oracle Database Configuration
spring.datasource.oracle.url=jdbc:oracle:thin:@localhost:1521/freepdb1
spring.datasource.oracle.username=courses
spring.datasource.oracle.password=oracle
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver


# SQLite Database Configuration
spring.datasource.sqlite.url=jdbc:sqlite:sqlite_database.db
spring.datasource.sqlite.driver-class-name=org.sqlite.JDBC